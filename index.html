<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Brüche am Zahlenstrahl</title>
<style>body{font-family:Arial;background:#eef4ff;text-align:center;padding:20px} .card{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:16px} canvas{width:100%;max-width:800px;border:1px solid #ccc} button,select,input{font-size:18px;padding:10px;margin:5px} #feedback{font-size:22px;font-weight:bold}</style></head>
<body><div class="card"><h1>📏 Brüche am Zahlenstrahl</h1><div id="stars">⭐</div><p>Richtige Aufgaben: <span id="score">0</span></p><select id="level" onchange="newTask()"><option value="leicht">⭐ Leicht</option><option value="mittel">⭐⭐ Mittel</option><option value="schwer">⭐⭐⭐ Schwer</option></select><h2 id="task"></h2><canvas id="canvas" width="800" height="220"></canvas><div id="answerArea"></div><button onclick="checkAnswer()">Prüfen</button><button onclick="newTask()">Neue Aufgabe</button><div id="feedback"></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let denominator,numerator,maxValue,currentTask,selectedTick=null;let score=Number(localStorage.getItem('bruchScore')||0);
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function upd(){scoreEl=document.getElementById('score');scoreEl.textContent=score;document.getElementById('stars').textContent=score>=20?'🏆⭐⭐⭐':score>=10?'⭐⭐⭐':score>=5?'⭐⭐':'⭐';localStorage.setItem('bruchScore',score)}
function draw(mark=null,sol=null){ctx.clearRect(0,0,800,220);let s=60,e=740,y=100,total=maxValue*denominator;ctx.beginPath();ctx.moveTo(s,y);ctx.lineTo(e,y);ctx.stroke();for(let i=0;i<=total;i++){let x=s+(e-s)*i/total;ctx.beginPath();ctx.moveTo(x,y-15);ctx.lineTo(x,y+15);ctx.stroke();if(i%denominator===0)ctx.fillText(i/denominator,x-5,y+35)}if(sol!==null){let x=s+(e-s)*sol/total;ctx.fillStyle='red';ctx.beginPath();ctx.arc(x,y,8,0,6.28);ctx.fill();ctx.fillStyle='black';}if(mark!==null){let x=s+(e-s)*mark/total;ctx.fillStyle='blue';ctx.beginPath();ctx.arc(x,y,8,0,6.28);ctx.fill();ctx.fillStyle='black';}}
function newTask(){document.getElementById('feedback').innerHTML='';selectedTick=null;let l=document.getElementById('level').value;if(l==='leicht'){denominator=ri(2,5);numerator=ri(1,denominator-1);maxValue=1}else if(l==='mittel'){denominator=ri(2,10);numerator=ri(1,denominator-1);maxValue=1}else{denominator=ri(2,10);numerator=ri(1,2*denominator-1);maxValue=2}currentTask=Math.random()<0.5?'ablesen':'eintragen';if(currentTask==='ablesen'){task.innerHTML='🔍 Welcher Bruch ist markiert?';draw(null,numerator);answerArea.innerHTML='<input id=z> / <input id=n>'}else{task.innerHTML='✏️ Trage '+numerator+'/'+denominator+' ein';draw();answerArea.innerHTML='Klicke auf einen Teilstrich.';canvas.onclick=(ev)=>{let r=canvas.getBoundingClientRect();let x=ev.clientX-r.left;let total=maxValue*denominator;let tick=Math.round(((x-60)/(740-60))*total);tick=Math.max(0,Math.min(total,tick));selectedTick=tick;draw(selectedTick);};}}
function checkAnswer(){if(currentTask==='ablesen'){if(Number(z.value)===numerator&&Number(n.value)===denominator){score++;upd();feedback.innerHTML='✅ Richtig!'}else feedback.innerHTML='❌ Richtig wäre '+numerator+'/'+denominator;}else{if(selectedTick===null){feedback.innerHTML='Bitte zuerst einen Teilstrich wählen.';return;}if(selectedTick===numerator){score++;upd();feedback.innerHTML='✅ Richtig!'}else{draw(selectedTick,numerator);feedback.innerHTML='❌ Rot zeigt die richtige Lösung.';}}}
upd();newTask();
</script></body></html>
