<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Brüche am Zahlenstrahl</title><style>body{font-family:Arial;background:#eef4ff;text-align:center;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;max-width:900px;margin:15px auto}canvas{border:1px solid #ccc;width:100%;max-width:750px}button,select,input{font-size:18px;padding:8px;margin:5px}</style></head><body><div class="card"><h1>📏 Brüche am Zahlenstrahl</h1><div id="stars">⭐</div>Richtige Aufgaben: <span id="correct">0</span><br><br><select id="level" onchange="newTask()"><option value="leicht">⭐ Leicht</option><option value="mittel">⭐⭐ Mittel</option><option value="schwer">⭐⭐⭐ Schwer</option></select><h2 id="task"></h2><canvas id="canvas" width="800" height="180"></canvas><div id="answerArea"></div><button onclick="checkAnswer()">Prüfen</button><button onclick="newTask()">Neue Aufgabe</button><div id="feedback"></div></div><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let denominator,numerator,maxValue,correctValue,currentTask,userPosition=null;let correct=Number(localStorage.getItem('correct')||0);function upd(){correctEl.textContent=correct;stars.textContent=correct>=20?'🏆⭐⭐⭐':correct>=10?'⭐⭐⭐':correct>=5?'⭐⭐':'⭐';localStorage.setItem('correct',correct)}function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function draw(p,m,mark=null){ctx.clearRect(0,0,800,180);let s=60,e=740,y=90,t=p*m;ctx.beginPath();ctx.moveTo(s,y);ctx.lineTo(e,y);ctx.stroke();for(let i=0;i<=t;i++){let x=s+i*(e-s)/t;ctx.beginPath();ctx.moveTo(x,y-15);ctx.lineTo(x,y+15);ctx.stroke();if(i%p===0)ctx.fillText(i/p,x-5,y+35)}if(mark!==null){let x=s+mark*(e-s)/t;ctx.fillStyle='red';ctx.beginPath();ctx.arc(x,y,8,0,6.28);ctx.fill();ctx.fillStyle='black';}}function newTask(){feedback.innerHTML='';let l=level.value;if(l==='leicht'){denominator=r(2,5);numerator=r(1,denominator-1);maxValue=1}else if(l==='mittel'){denominator=r(2,10);numerator=r(1,denominator-1);maxValue=1}else{denominator=r(2,10);numerator=r(1,2*denominator-1);maxValue=2}correctValue=numerator/denominator;currentTask=Math.random()<0.5?'ablesen':'eintragen';if(currentTask==='ablesen'){task.innerHTML='🔍 Welcher Bruch ist markiert?';draw(denominator,maxValue,numerator);answerArea.innerHTML='<input id=z> / <input id=n>';}else{task.innerHTML='✏️ Trage '+numerator+'/'+denominator+' ein';draw(denominator,maxValue);answerArea.innerHTML='Klicke auf den Zahlenstrahl.';canvas.onclick=e=>{let rct=canvas.getBoundingClientRect(),x=e.clientX-rct.left;userPosition=((x-60)/(740-60))*maxValue;draw(denominator,maxValue);ctx.fillStyle='blue';ctx.beginPath();ctx.arc(x,90,8,0,6.28);ctx.fill();};}}function checkAnswer(){if(currentTask==='ablesen'){if(Number(z.value)===numerator&&Number(n.value)===denominator){correct++;upd();feedback.innerHTML='✅ Richtig!'}else feedback.innerHTML='❌ Richtig wäre '+numerator+'/'+denominator}else{if(userPosition===null){feedback.innerHTML='Bitte zuerst klicken.';return}if(Math.abs(userPosition-correctValue)<0.05*maxValue){correct++;upd();feedback.innerHTML='✅ Richtig!'}else feedback.innerHTML='❌ Noch einmal versuchen.'}}upd();newTask();</script></body></html>
